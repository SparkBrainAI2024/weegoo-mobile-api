input CreatePromoCodeInput {
  """
  The alphanumeric code name, e.g., "WELCOME50"
  """
  name: String!

  """Whether the discount is a percentage or flat amount"""
  discountType: DiscountTypeEnum!

  """Percentage value (0-100) if discountType is PERCENTAGE"""
  percentageAmount: Float

  """Fixed currency amount if discountType is FLAT"""
  flatAmount: Float

  """Cap on the discount amount for percentage-based promos"""
  maxDiscount: Float

  """Minimum ride fare required to apply this code"""
  minimumFare: Float
  appliedTo: AppliedToEnum!

  """Maximum number of times this code can be used in total"""
  totalUsageLimit: Float!

  """Maximum number of times a single user can use this code"""
  perUserLimit: Float!

  """When the promo code becomes valid"""
  startDateTime: DateTime!

  """When the promo code expires"""
  expiryDateTime: DateTime!
  occasionId: ID!
}

