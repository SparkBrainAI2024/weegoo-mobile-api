  editVehicle(vehicleId: String!, input: EditVehicleInput!): VehicleRegistrationResponse!
  deletePassenger(input: DeletePassengerInput!): Boolean!
  blockPassenger(id: ID!): PassengerListItem!
  unblockPassenger(id: ID!): PassengerListItem!
  approveDriverDocumentFile(input: ApproveDocumentFileInput!): DriverDocument!
  rejectDriverDocumentFile(input: RejectDocumentFileInput!): DriverDocument!
