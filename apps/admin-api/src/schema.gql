  adminSignUp(input: AdminSignUpInput!): AdminSignUpResponse!
  adminSignIn(input: AdminSignInInput!): AdminSignInResponse!
  adminForgotPassword(input: AdminForgotPasswordInput!): BasicResponse!
  adminVerifyOtp(input: AdminVerifyOtpInput!): AdminVerifyOTPResponse!
