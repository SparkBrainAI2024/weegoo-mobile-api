  promoCodes(paginationInput: PromoCodeFindAllInput!): PromocodeListWithPaginationResponse!
  occasion(paginationInput: PaginationInputOnly!): [Occasion!]!
  getNotifications(options: CursorPaginationInput!): NotificationListWithCursorPaginationResponse!
  unreadNotificationCount: Int!
  getDriver(driverId: String!): DriverWDocuments!
  getDrivers(input: DriverListInput): DriverListResponse!
  driverTrips(driverId: ID!, page: Int, limit: Int, search: String, status: String, orderBy: String, order: String): DriverTripsPage!
  driverCommissionSummary(driverId: ID!): DriverCommissionSummary!
  myDriverDocuments: [DriverDocument!]!
  driverDocumentFileViewUrl(documentType: DriverDocumentType!, side: DriverDocumentSide!): DocumentViewUrlResponse!
  getVehicle: Vehicle!
  getPassengers(input: PassengerListInput): PassengerListResponse!
  getRiderOverview(riderId: String!): RiderOverviewResponse!
  getRiderTrips(input: RiderTripsInput!): RiderTripsResponse!
  getPassengerRatings(input: RiderRatingsInput!): RiderRatingsResponse!
  rides(input: RidesListInput!): RidesListResponse!
  ride(id: String!): Rides

  """
  Returns paginated transaction history for the logged-in user. If logged in as USER (rider), queries by riderId. If logged in as RIDER (driver), queries by driverId.
  """
  getTransactionHistory(input: TransactionPaginationInput!): TransactionListWithPaginationResponse!
}

input PaginationInputOnly {
  page: Int! = 0
  limit: Int! = 5
}

input PromoCodeFindAllInput {
  page: Int! = 0
  limit: Int! = 5
  orderBy: String
  order: SortBy! = desc
  searchText: String
  filter: PromoCodeFilterInput
}

"""Order by direction for pagination"""
enum SortBy {
  """Ascending order"""
  asc

  """Descending order"""
  desc
}

input PromoCodeFilterInput {
  status: PromoCodeStatusEnum
  appliedTo: AppliedToEnum
  occasion: ID
}

input CursorPaginationInput {
  limit: Int! = 5
  cursor: String
  sortOrder: SortBy
}

input DriverListInput {
  page: Int! = 0
  limit: Int! = 5
  search: String
  status: String
}

input PassengerListInput {
  page: Int! = 0
  limit: Int! = 5
  search: String
  status: String
}

input RiderTripsInput {
  riderId: ID!
  page: Float = 0
  limit: Float = 10
  search: String
  status: String
  paymentMethod: String
}

input RiderRatingsInput {
  riderId: ID!
  page: Float = 0
  limit: Float = 10
}

input RidesListInput {
  status: RideStatus
  timeRange: RideTimeRange! = LAST_24_HOURS
  search: String
  page: Int! = 1
  limit: Int! = 10
}

