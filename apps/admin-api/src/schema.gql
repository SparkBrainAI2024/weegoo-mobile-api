  updatePage(id: ID!, input: UpdatePageInput!): Page!
  publishPage(id: ID!): Page!
  unpublishPage(id: ID!): Page!
  removePage(id: ID!): Boolean!
  createPromoCode(input: CreatePromoCodeInput!): PromocodeCreateResponse!

  """Updates a existing promo code"""
  updatePromoCode(id: ID!, input: UpdatePromoCodeInput!): PromocodeUpdateResponse!
  activatePromoCode(id: ID!): PromoCode!
  deactivatePromoCode(id: ID!): PromoCode!
  removePromoCode(id: ID!): Boolean!
  readNotification(id: String!): Notification!
  openNotifications: Notification!
  createNotification(notificationPayload: CreateNotificationInput!): Notification!
  deleteDriver(input: DeleteDriverInput!): DeleteDriverResponse!
  blockDriver(id: ID!): SuspendDriverResponse!
  unblockDriver(id: ID!): SuspendDriverResponse!
